[project]
name = "semcache"
version = "1.0.0"
description = "Semantic caching for NLP queries using TF-IDF, SVD (LSA), cosine similarity and LSH, implemented from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
eval = ["matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
gradio = ["gradio>=6.0"]
notebook = ["matplotlib>=3.8", "pandas>=2.0", "ipywidgets>=8.0", "jupyter"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
semcache = "semcache.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semcache*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
